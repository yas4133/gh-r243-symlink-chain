name: Privileged isolated-data consumer

on:
  workflow_run:
    workflows: ["Untrusted data producer"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  consume:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Canonical trusted state before artifact
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/artifacts"
          ln -s "$GITHUB_WORKSPACE/trusted" "$RUNNER_TEMP/artifacts/link"
          test -L "$RUNNER_TEMP/artifacts/link"
          test "$(sha256sum trusted/consume.sh | cut -d' ' -f1)" = \
            'e94896920acdeb3a547f5e7974fad2b74b6835b97f7baebcaa23d0c11795506c'
          test ! -e GH_R243_TEMP_ISOLATION_WRITE.txt
          printf 'GH_R243_TEMP_BEFORE trusted_sha256=%s download_root=%s symlink_target=%s durable_absent=yes\n' \
            "$(sha256sum trusted/consume.sh | cut -d' ' -f1)" \
            "$RUNNER_TEMP/artifacts" \
            "$(readlink -f "$RUNNER_TEMP/artifacts/link")"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          name: untrusted-data
          path: ${{ runner.temp }}/artifacts
      - name: Execute trusted consumer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash trusted/consume.sh
      - name: Canonical durable state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/contents/GH_R243_TEMP_ISOLATION_WRITE.txt?ref=main" \
            --jq '{sha:.sha,content:(.content|@base64d)}'
